<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>屏幕问答器</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <div id="toast-region" aria-live="polite"></div>
  <section id="auth-view" class="auth-layout">
    <div class="auth-brand">
      <span class="eyebrow">屏幕问答</span>
      <h1>屏幕问答器</h1>
      <div class="auth-status-line"><span class="status-dot online"></span>服务端控制台</div>
    </div>
    <div class="auth-panel">
      <div class="auth-tabs">
        <button class="tab-button active" data-auth-tab="login">登录</button>
        <button class="tab-button" data-auth-tab="register">注册账号</button>
      </div>
      <form id="login-form" class="auth-form">
        <label>用户名<input name="username" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="primary-button" type="submit">登录控制台</button>
        <p id="login-message" class="form-message"></p>
      </form>
      <form id="register-form" class="auth-form hidden">
        <label>用户名<input name="username" autocomplete="username" pattern="[A-Za-z0-9_.\-]{3,80}" required></label>
        <label>显示名称<input name="display_name" required></label>
        <label>密码<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <label>注册备注<textarea name="registration_note" rows="3" maxlength="500" required></textarea></label>
        <button class="primary-button" type="submit">提交注册申请</button>
        <p id="register-message" class="form-message"></p>
      </form>
    </div>
  </section>

  <section id="app-view" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-mark"><span class="brand-square">S</span><span>屏幕问答器</span></div>
      <nav id="main-nav" class="main-nav">
        <button data-page="dashboard" class="nav-item active"><span class="nav-glyph">◆</span>设备控制</button>
        <button data-page="history" class="nav-item"><span class="nav-glyph">▤</span>问答历史</button>
        <button data-page="prompts" class="nav-item"><span class="nav-glyph">✦</span>提示词</button>
        <button data-page="models" class="nav-item"><span class="nav-glyph">◈</span>模型配置</button>
        <button data-page="credentials" class="nav-item"><span class="nav-glyph">▣</span>客户端凭证</button>
        <button data-page="users" class="nav-item admin-only"><span class="nav-glyph">◎</span>账号管理</button>
        <button data-page="audit" class="nav-item admin-only"><span class="nav-glyph">≡</span>审计日志</button>
      </nav>
      <div class="sidebar-foot">
        <div id="connection-indicator" class="connection-indicator"><span class="status-dot"></span><span>正在连接</span></div>
        <button id="logout-button" class="quiet-button">退出登录</button>
      </div>
    </aside>
    <main class="main-content">
      <header class="topbar">
        <div><span class="eyebrow" id="page-eyebrow">控制中心</span><h2 id="page-title">设备控制</h2></div>
        <div class="account-menu"><span id="account-name"></span><span id="account-role" class="role-label"></span><button id="profile-button" class="quiet-button">账号设置</button></div>
      </header>
      <div id="page-content" class="page-content"></div>
    </main>
  </section>

  <div id="modal-root"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
